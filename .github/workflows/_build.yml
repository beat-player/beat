# Each matrix job compiles, tests, packages and uploads its own asset. There is deliberately no
# aggregate job: a failed target must not block or remove the assets the others built. Each job
# runs the whole suite on its own platform after compiling and before anything is uploaded, so a
# platform whose tests fail publishes nothing over the nightly or a release.
name: Build Beat

on:
  workflow_call:
    inputs:
      channel:
        description: "Where the binaries go: nightly or release."
        required: true
        type: string
      tag:
        description: "Release tag to upload to."
        required: true
        type: string

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86-64
            outfile: beat
            archive: beat-linux-x86-64.zip
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            outfile: beat
            archive: beat-linux-aarch64.zip
          - os: windows-latest
            target: windows-x86-64
            outfile: beat.exe
            archive: beat-windows-x86-64.zip
          - os: windows-11-arm
            target: windows-aarch64
            outfile: beat.exe
            archive: beat-windows-aarch64.zip
          - os: macos-15-intel
            target: macos-x86-64
            outfile: beat
            archive: beat-macos-x86-64.zip
          - os: macos-15
            target: macos-aarch64
            outfile: beat
            archive: beat-macos-aarch64.zip

    env:
      OUTFILE: ${{ matrix.outfile }}
      ARCHIVE: ${{ matrix.archive }}
      # A release drops the nightly commit suffix from the generated version.
      BEAT_RELEASE: ${{ inputs.channel == 'release' && '1' || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: lde-org/setup-lde@v2
        with:
          version: nightly

      - name: Cache Windows native toolchain
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.lde/mingw
          key: lde-mingw-${{ runner.arch }}

      - name: Install Windows native toolchain
        if: runner.os == 'Windows'
        run: lde --ensure-mingw

      - name: Cache glslang (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: glslang
          key: glslang-16.6.0-windows-x86_64

      # The suite draws screens headless and needs a Vulkan device for that: lavapipe draws on the
      # CPU on Linux, MoltenVK on macOS. Where no device can be made (a Windows runner has none),
      # the drawing tests skip themselves and everything else still runs.
      - name: Install shader compiler and test driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools mesa-vulkan-drivers libvulkan1

      - name: Install shader compiler and test driver (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang molten-vk vulkan-loader

      - name: Install shader compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "glslang\bin\glslang.exe")) {
            Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip" -OutFile glslang.zip
            Expand-Archive -Path glslang.zip -DestinationPath glslang
          }
          "$env:GITHUB_WORKSPACE\glslang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: lde sync -C packages/beat

      - name: Build ${{ matrix.target }}
        shell: bash
        run: lde compile -C packages/beat --outfile "$OUTFILE"

      - name: Test ${{ matrix.target }}
        shell: bash
        run: lde test -C packages/beat

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: zip -q -j "packages/beat/$ARCHIVE" "packages/beat/$OUTFILE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item "packages/beat/$env:ARCHIVE" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "packages/beat/$env:OUTFILE" -DestinationPath "packages/beat/$env:ARCHIVE"

      # The Flatpak packs this same binary rather than building its own; see the flatpak job.
      - name: Keep the Linux binary for the Flatpak
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: beat-${{ matrix.target }}
          path: packages/beat/${{ matrix.outfile }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload nightly release
        if: inputs.channel == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          overwrite_files: true
          body: |
            Automated nightly build from `${{ github.ref_name }}`.
            Commit: `${{ github.sha }}`
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: packages/beat/${{ matrix.archive }}
          fail_on_unmatched_files: true

      - name: Upload release asset
        if: inputs.channel == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: packages/beat/${{ matrix.archive }}
          fail_on_unmatched_files: true

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-aarch64-apk
            outfile: beat-android-aarch64.apk
          - target: android-x86-64-apk
            outfile: beat-android-x86-64.apk

    env:
      TARGET: ${{ matrix.target }}
      OUTFILE: ${{ matrix.outfile }}
      # A release drops the nightly commit suffix from the generated version.
      BEAT_RELEASE: ${{ inputs.channel == 'release' && '1' || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: lde-org/setup-lde@v2
        with:
          version: nightly

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Select Android toolchain
        run: |
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          # Dependency build scripts run `strip` on the libraries they build. The host's GNU strip
          # only reads x86-64 objects, so an aarch64 library fails the build; the NDK's llvm-strip
          # reads every architecture the APK targets, and is put first on PATH under that name.
          tools="$RUNNER_TEMP/android-tools"
          mkdir -p "$tools"
          ln -sf "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "$tools/strip"
          "$tools/strip" --version
          echo "$tools" >> "$GITHUB_PATH"

      - name: Cache native deps
        uses: actions/cache@v5
        with:
          path: |
            packages/*/target/curl-sys
            packages/*/target/deflate-sys
            packages/*/target/git2-sys
          key: native-deps-ubuntu-22.04-x64-${{ matrix.target }}

      - name: Install shader compiler and test driver
        run: sudo apt-get update && sudo apt-get install -y glslang-tools mesa-vulkan-drivers libvulkan1

      - name: Install dependencies
        run: lde sync -C packages/beat

      # An APK cannot run here, so the suite runs on this runner's Linux build of the same code:
      # what the phone runs is the Lua it tests, and a failure stops the APK being published.
      - name: Test
        run: lde test -C packages/beat

      - name: Build ${{ matrix.target }}
        run: lde compile -C packages/beat --target "$TARGET" --outfile "$OUTFILE"

      - name: Upload nightly release
        if: inputs.channel == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          overwrite_files: true
          body: |
            Automated nightly build from `${{ github.ref_name }}`.
            Commit: `${{ github.sha }}`
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: packages/beat/${{ matrix.outfile }}
          fail_on_unmatched_files: true

      - name: Upload release asset
        if: inputs.channel == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: packages/beat/${{ matrix.outfile }}
          fail_on_unmatched_files: true

  # The Linux binary from the build job, packed as a Flatpak bundle. It runs once that job is done
  # even when another platform failed: a Windows failure must not hold back the Linux packages. A
  # Linux job whose tests failed uploaded no binary, so there is nothing for this one to pack.
  flatpak:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The image ships the SDK of the manifest's runtime already installed. Keep the two versions the
    # same: a runtime the image does not carry is installed or updated inside the container, which
    # fails there ("Invalid cross-device link") and takes the build down with it.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            binary: beat-linux-x86-64
            bundle: beat-linux-x86-64.flatpak
          - runner: ubuntu-24.04-arm
            arch: aarch64
            binary: beat-linux-aarch64
            bundle: beat-linux-aarch64.flatpak

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch the Linux binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: packaging/flatpak

      # flatpak-builder is run directly rather than through flatpak/flatpak-github-actions: that
      # action always passes --install-deps-from, which updates the image's runtimes in place, and
      # an update inside this container fails ("Invalid cross-device link"). The image already has
      # the SDK and platform the manifest names, and the bundle only packs a prebuilt binary, so
      # nothing needs installing or updating.
      - name: Build the bundle
        shell: bash
        run: |
          flatpak-builder --repo=repo --disable-rofiles-fuse --force-clean --default-branch=master \
            --arch="${{ matrix.arch }}" flatpak_app packaging/flatpak/io.github.beat_player.Beat.yml
          flatpak build-bundle --arch="${{ matrix.arch }}" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "${{ matrix.bundle }}" io.github.beat_player.Beat master

      - name: Upload nightly release
        if: inputs.channel == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          overwrite_files: true
          files: ${{ matrix.bundle }}
          fail_on_unmatched_files: true

      - name: Upload release asset
        if: inputs.channel == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.bundle }}
          fail_on_unmatched_files: true

  # The Linux binary from the build job, packed as an AppImage; see packaging/appimage/build.sh.
  # Like the Flatpak, it does not wait on the other platforms succeeding, and has no binary to pack
  # when the Linux job's tests failed.
  appimage:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            binary: beat-linux-x86-64
            appimage: beat-linux-x86-64.AppImage
          - runner: ubuntu-24.04-arm
            arch: aarch64
            binary: beat-linux-aarch64
            appimage: beat-linux-aarch64.AppImage

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch the Linux binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: linux

      - name: Build the AppImage
        shell: bash
        run: packaging/appimage/build.sh linux/beat "${{ matrix.arch }}" "${{ matrix.appimage }}"

      - name: Upload nightly release
        if: inputs.channel == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          overwrite_files: true
          files: ${{ matrix.appimage }}
          fail_on_unmatched_files: true

      - name: Upload release asset
        if: inputs.channel == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.appimage }}
          fail_on_unmatched_files: true
